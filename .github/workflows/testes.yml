name: testes

on:
  push:
  pull_request:

jobs:
  testes:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Instalar o Talos e as dependências de teste
        run: python -m pip install -e ".[teste]"
      - name: Rodar os testes
        run: python -m pytest -v
      - name: Conferir a linha de comando
        run: python -m talos --versao
