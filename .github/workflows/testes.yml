name: testes

on:
  push:
  pull_request:

jobs:
  testes:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Instalar o Talos e as dependências de teste
        run: python -m pip install -e ".[teste]"
      - name: Rodar os testes
        shell: bash
        # Cada teste que falhar vira uma anotação (::error::), visível no resumo do GitHub
        run: |
          set +e
          python -m pytest -v --tb=line -rf 2>&1 | tee resultado_testes.txt
          situacao=${PIPESTATUS[0]}
          grep -E "^(FAILED|ERROR) |^(/|[A-Za-z]:).*:[0-9]+: " resultado_testes.txt | head -20 | sed 's/^/::error::/'
          exit $situacao
      - name: Conferir a linha de comando
        run: python -m talos --versao
