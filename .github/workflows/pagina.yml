name: pagina

# Monta o protótipo web (prototipo/montar.py) e publica no GitHub Pages.
# Roda a cada push na branch main, depois que os testes passam.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pagina
  cancel-in-progress: true

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[teste]"
      - name: Rodar os testes
        shell: bash
        # Versões instaladas e cada teste que falhar viram anotações, visíveis no resumo do GitHub
        run: |
          set +e
          echo "::notice title=Versões::$(python -c 'import sys, numpy, scipy, pandas, pytest; print(sys.version.split()[0], "numpy", numpy.__version__, "scipy", scipy.__version__, "pandas", pandas.__version__, "pytest", pytest.__version__)')"
          python -m pytest -v --tb=short -rf 2>&1 | tee resultado_testes.txt
          situacao=${PIPESTATUS[0]}
          grep -E "^(FAILED|ERROR) |^E  |Error" resultado_testes.txt | head -20 | sed 's/^/::error::/'
          exit $situacao

  montar:
    needs: testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Montar a página com o motor Talos (Pyodide vem do jsDelivr)
        run: python prototipo/montar.py --cdn
      - uses: actions/upload-pages-artifact@v3
        with:
          path: prototipo/dist

  publicar:
    needs: montar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - id: publicacao
        uses: actions/deploy-pages@v4
