[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "talos"
dynamic = ["version"]
description = "Motor de alocação de carteiras por meta para investidores de baixa e média renda (simulação)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<3",
    "scipy>=1.10,<2",
    "pandas>=2.0,<4",
]

[project.optional-dependencies]
teste = [
    "pytest>=7.0",
]

[project.scripts]
talos = "talos.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "talos.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
